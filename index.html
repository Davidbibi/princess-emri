<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WordLand">
<meta name="theme-color" content="#e8dcff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<body><title>Princess Emri's Candy Land</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen candy world. Princess Emri on one side, the play area on the other; stacks in portrait. Single deliberate light candy look. */
:root {
  --sky: #ffe3f1;
  --sky2: #e8dcff;
  --ink: #4a2160;
  --ink-soft: #7b5c8e;
  --berry: #ff4f9a;
  --berry-d: #c92d73;
  --grape: #8e4fd1;
  --mint: #2fbf94;
  --lemon: #ffd84d;
  --card: #ffffff;
  --card-edge: #ecd6f7;
  --display: 'Fredoka', 'Varela Round', 'Arial Rounded MT Bold', system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--sky); color: var(--ink);
  font-family: var(--display); -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-touch-callout: none;
}
#app {
  position: relative; height: 100%; overflow: hidden;
  background:
    radial-gradient(circle at 18px 18px, rgba(255,255,255,.55) 3px, transparent 4px) 0 0 / 56px 56px,
    linear-gradient(180deg, var(--sky2) 0%, var(--sky) 55%, #ffeedd 100%);
}
#app[data-world="sea"] {
  background:
    radial-gradient(circle at 18px 18px, rgba(255,255,255,.4) 3px, transparent 4px) 0 0 / 70px 70px,
    linear-gradient(180deg, #dcf5ff 0%, #a6def5 55%, #7ccbec 100%);
}
#app[data-world="animals"] {
  background:
    radial-gradient(circle at 18px 18px, rgba(255,255,255,.45) 3px, transparent 4px) 0 0 / 64px 64px,
    linear-gradient(180deg, #f0fbe4 0%, #d4f0bd 55%, #b9e39b 100%);
}
#app[data-world="dragons"] {
  background:
    radial-gradient(circle at 18px 18px, rgba(255,255,255,.45) 3px, transparent 4px) 0 0 / 64px 64px,
    linear-gradient(180deg, #ffeadf 0%, #ffd2b8 55%, #f6b493 100%);
}
#app[data-world="space"] {
  background:
    radial-gradient(circle at 20px 20px, rgba(255,255,255,.8) 1.5px, transparent 2.5px) 0 0 / 90px 90px,
    radial-gradient(circle at 60px 54px, rgba(255,255,255,.55) 1px, transparent 2px) 0 0 / 70px 70px,
    linear-gradient(180deg, #2a2063 0%, #43358a 55%, #6a54b8 100%);
}
#app[data-world="space"] .topbar h2 { color: #fff; }
#app[data-world="space"] .topbar h2 .en { color: #ffd84d; }
#app[data-world="space"] .bub {
  background: radial-gradient(circle at 32% 28%, #fff 0 9%, rgba(255,255,255,.85) 10% 22%, rgba(255,255,255,.72) 60%, rgba(255,255,255,.9) 100%);
  box-shadow: inset 0 0 0 4px #fff, 0 0 22px 4px rgba(255,216,77,.55);
}
#app[data-world="space"] .mback { box-shadow: 0 0 0 4px #fff, 0 10px 20px rgba(0,0,0,.25); }
.twk { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
.twk:nth-of-type(3n) { animation-delay: -1s; }
.twk:nth-of-type(4n) { animation-delay: -1.8s; }
.floaty { animation: floaty 4s ease-in-out infinite; transform-box: fill-box; }
.floaty:nth-of-type(2n) { animation-delay: -2s; }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

/* ---------- World picker ---------- */
.world-list { flex: 1; min-height: 0; display: flex; flex-wrap: wrap; gap: 3vmin; justify-content: center; align-content: center; }
.wcard {
  font: inherit; color: var(--ink); border: 0; cursor: pointer;
  width: min(29vw, 300px); border-radius: 36px; padding: 3.4vmin 2vmin; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 1.2vmin;
  box-shadow: 0 8px 0 rgba(74,33,96,.12), 0 16px 30px rgba(74,33,96,.14); transition: transform .15s;
}
.wcard:active { transform: scale(.96); }
.wcard:focus-visible { outline: 4px solid var(--grape); outline-offset: 4px; }
.w-candy { background: linear-gradient(180deg, #ffe6f3, #ffc4e0); }
.w-sea { background: linear-gradient(180deg, #e0f6ff, #93d5f1); }
.w-animals { background: linear-gradient(180deg, #eefbe0, #b9e39b); }
.w-dragons { background: linear-gradient(180deg, #ffeadc, #ffbf9b); }
.w-space { background: linear-gradient(180deg, #e6e0ff, #a99be8); }
.wicon { font-size: clamp(64px, 12vmin, 120px); line-height: 1.1; }
.wname { font-size: clamp(24px, 3.8vmin, 38px); font-weight: 700; }
.wen { direction: ltr; font-size: clamp(16px, 2.4vmin, 22px); color: var(--ink-soft); }
@media (orientation: portrait) { .wcard { width: min(42vw, 300px); } }

/* ---------- Who's playing ---------- */
.player-list { flex: 1; min-height: 0; display: flex; flex-wrap: wrap; gap: 5vmin; justify-content: center; align-content: center; }
.pcard {
  font: inherit; color: var(--ink); border: 0; cursor: pointer;
  width: min(36vw, 340px); border-radius: 40px; padding: 3vmin 2vmin; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 1.2vmin;
  box-shadow: 0 8px 0 rgba(74,33,96,.14), 0 16px 30px rgba(74,33,96,.16); transition: transform .15s;
}
.pcard:active { transform: scale(.96); }
.pcard:focus-visible { outline: 4px solid var(--grape); outline-offset: 4px; }
.pc-emri { background: linear-gradient(180deg, #ffe0f1, #d9b8ff); }
.pc-lavi { background: linear-gradient(180deg, #d8fbf4, #8fd0f5); }
.pcard .princess { height: min(38vh, 300px); width: auto; max-width: 100%; }
.pname { font-size: clamp(36px, 7vmin, 68px); font-weight: 700; line-height: 1; }
@media (orientation: portrait) { .pcard { width: min(42vw, 340px); } .pcard .princess { height: 30vh; } }
.avatar {
  width: 56px; height: 56px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; overflow: hidden;
  background: var(--card); box-shadow: 0 4px 0 var(--card-edge), inset 0 0 0 3px var(--card-edge); flex: none;
}
.avatar .princess { width: 170%; height: auto; margin: -2% 0 0 -35%; pointer-events: none; }
.avatar:focus-visible { outline: 4px solid var(--grape); outline-offset: 3px; }

.screen {
  position: absolute; inset: 0; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.topbar h2 { margin: 0; font-size: clamp(20px, 3vmin, 30px); font-weight: 600; text-wrap: balance; }
.topbar h2 .en { direction: ltr; unicode-bidi: isolate; color: var(--grape); }

.btn {
  font: inherit; font-size: clamp(18px, 2.6vmin, 26px); font-weight: 600;
  border: 0; border-radius: 999px; padding: .55em 1.2em; cursor: pointer;
  background: var(--card); color: var(--ink); box-shadow: 0 5px 0 var(--card-edge);
  transition: transform .1s, box-shadow .1s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--card-edge); }
.btn.primary { background: var(--berry); color: #fff; box-shadow: 0 6px 0 var(--berry-d); }
.btn.primary:active { box-shadow: 0 2px 0 var(--berry-d); }
.btn.big { font-size: clamp(26px, 4.4vmin, 44px); padding: .5em 1.6em; }
.btn:focus-visible, .opt:focus-visible, .node:focus-visible { outline: 4px solid var(--grape); outline-offset: 4px; }
.tools { display: flex; align-items: center; gap: 10px; }
.music, .bookbtn {
  font: inherit; font-size: clamp(20px, 3vmin, 28px); border: 0; padding: 0; cursor: pointer;
  width: clamp(44px, 6.4vmin, 58px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  background: var(--card); box-shadow: 0 4px 0 var(--card-edge);
}
.music.off { opacity: .55; }
.music:focus-visible, .bookbtn:focus-visible { outline: 4px solid var(--grape); outline-offset: 3px; }
/* home: press and hold ~1 s to leave a level (a quick tap only wiggles), so a stray touch never ends the game */
.home {
  position: relative; width: 56px; height: 56px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; flex: none;
  font: inherit; font-size: 28px; display: grid; place-items: center; background: var(--card); box-shadow: 0 4px 0 var(--card-edge);
  margin-inline-end: 34px; touch-action: none;
}
.home .ring { position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); transform: rotate(-90deg); pointer-events: none; }
.home .ring circle { fill: none; stroke: var(--berry); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 189; stroke-dashoffset: 189; }
.home.holding .ring circle { stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
.home.wiggle { animation: wiggle .5s ease; }
.home:focus-visible { outline: 4px solid var(--grape); outline-offset: 5px; }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 50% { transform: rotate(12deg); } 75% { transform: rotate(-6deg); } }
.chip { background: var(--card); border-radius: 999px; padding: .35em .9em; font-weight: 600; font-size: clamp(18px, 2.6vmin, 26px); box-shadow: 0 4px 0 var(--card-edge); font-variant-numeric: tabular-nums; }

/* ---------- Princess ---------- */
.princess { display: block; overflow: visible; }
.princess .p-all { transform-origin: 100px 295px; animation: bob 3.2s ease-in-out infinite; }
.princess.happy .p-all { animation: hop .75s ease; }
.princess.sad .p-all { animation: tilt .7s ease; }
.princess .lid { transform-box: fill-box; transform-origin: center top; transform: scaleY(0); animation: blink 5s infinite; }
.princess .wand-arm { transform-origin: 128px 142px; animation: wave 2.6s ease-in-out infinite; }
.princess .wings { transform-origin: 100px 150px; animation: flap 1.8s ease-in-out infinite; }
@keyframes flap { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(1.08) translateY(-2px); } }
.princess .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.2s ease-in-out infinite; }
.princess .tw:nth-of-type(2n) { animation-delay: .8s; }
.princess .tw:nth-of-type(3n) { animation-delay: 1.4s; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes hop { 0% { transform: translateY(0) scale(1); } 30% { transform: translateY(-26px) scale(1.04,.98); } 60% { transform: translateY(0) scale(1.03,.96); } 100% { transform: translateY(0); } }
@keyframes tilt { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-5deg); } 65% { transform: rotate(4deg); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(0); } 95%, 97% { transform: scaleY(1); } }
@keyframes wave { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(7deg); } }
@keyframes twinkle { 0%,100% { transform: scale(.4); opacity: .4; } 50% { transform: scale(1.1); opacity: 1; } }

/* ---------- Title ---------- */
#title .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 5vmin; flex-wrap: wrap; }
#title .princess { height: min(68vh, 520px); width: auto; max-width: 100%; }
.title-text { display: flex; flex-direction: column; align-items: center; gap: 2.4vmin; text-align: center; }
h1 { margin: 0; font-size: clamp(40px, 8vmin, 84px); line-height: 1.02; font-weight: 700; color: var(--grape); text-shadow: 0 4px 0 #ffd0e6, 0 8px 0 rgba(142,79,209,.15); text-wrap: balance; }
.en-sub { direction: ltr; font-size: clamp(20px, 3.6vmin, 36px); font-weight: 500; color: var(--berry); }
.note { font-size: clamp(14px, 2vmin, 18px); color: var(--ink-soft); max-width: 34ch; }

/* ---------- Map ---------- */
#map .world { flex: 1; min-height: 0; width: 100%; }
.node { cursor: pointer; }
.node.locked { cursor: default; }
.node:focus:not(:focus-visible) { outline: none; } /* no ring after a tap; keyboard focus still shows */
#world.big .lbl, #world.big .lbl-bg { display: none; } /* small phone map: bigger nodes, no (unreadable) labels */
.node .base { transform-box: fill-box; transform-origin: center; }
.node.current .base { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.lbl { font-family: var(--display); font-weight: 600; font-size: 23px; fill: var(--ink); }
.node .ic, .node, .pointer { transform-box: fill-box; transform-origin: center; }
.node.wiggle .ic { animation: wiggle .5s ease; }
.node.hop { animation: nodeHop .8s ease; transform-origin: center bottom; }
.pointer { animation: point 1s ease-in-out infinite; }
@keyframes nodeHop { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-22px); } 55% { transform: translateY(0) scale(1.06,.94); } 75% { transform: translateY(-8px); } }
@keyframes point { 0%,100% { transform: translateY(0); } 50% { transform: translateY(12px); } }

/* ---------- Play stage (learn + quiz) ---------- */
.stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 30%) minmax(0, 1fr); gap: 3vmin; align-items: center; }
.hero { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.hero .princess { height: min(46vh, 360px); width: auto; max-width: 100%; }
.p-slot { display: contents; }
.bubble {
  position: relative; background: var(--card); border-radius: 28px; padding: 14px 18px;
  text-align: center; box-shadow: 0 6px 0 var(--card-edge); max-width: 100%; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.bubble::after { content: ""; position: absolute; bottom: -16px; left: 50%; margin-left: -12px; border: 12px solid transparent; border-top: 16px solid var(--card); border-bottom: 0; }
.bubble .en { direction: ltr; font-size: clamp(22px, 3.6vmin, 36px); font-weight: 600; line-height: 1.15; }
.bubble .he { font-size: clamp(15px, 2.2vmin, 20px); color: var(--ink-soft); }
.say {
  width: clamp(48px, 7vmin, 64px); aspect-ratio: 1; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--berry); box-shadow: 0 5px 0 var(--berry-d); display: grid; place-items: center; padding: 0;
}
.say:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--berry-d); }
.say svg { width: 58%; height: 58%; }
.say.nudge { animation: nudge .6s ease 3; }
@keyframes nudge { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); box-shadow: 0 5px 0 var(--berry-d), 0 0 0 10px rgba(255,79,154,.3); } }
/* Lavi reads: the prompt is a big written word (R1) or a picture (R2) */
.bubble.read .en { font-size: clamp(36px, 7vmin, 72px); font-weight: 700; color: var(--grape); }
.qpic { width: min(24vmin, 210px); aspect-ratio: 1; display: grid; place-items: center; container-type: inline-size; }

.options { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 3vmin; height: 100%; }
.opt {
  width: min(25vmin, 230px); aspect-ratio: 1; max-width: 100%; box-sizing: border-box;
  border: 0; border-radius: 34px; background: var(--card); cursor: pointer; padding: 14px;
  box-shadow: 0 8px 0 var(--card-edge), 0 14px 28px rgba(142,79,209,.14);
  display: grid; place-items: center; container-type: inline-size; transition: transform .15s, opacity .25s;
  font: inherit; color: inherit;
}
.opt:active { transform: scale(.96); }
.options.n4 .opt { width: min(20vmin, 196px); }
.options.n6 { display: grid; grid-template-columns: repeat(3, min(21vmin, 200px)); justify-content: center; align-content: center; }
.options.n6 .opt { width: 100%; }
.opt.wordcard { aspect-ratio: auto; width: min(32vmin, 290px); min-height: min(14vmin, 120px); direction: ltr; font-weight: 700; color: var(--grape); }
.options.n4 .opt.wordcard { width: min(30vmin, 280px); }
.options.n6 .opt.wordcard { min-height: min(12vmin, 104px); }
.wd { direction: ltr; font-weight: 700; color: var(--grape); line-height: 1; white-space: nowrap; }
/* colour words are written in plain dark ink, so the ink colour never hints at (or fights with) the answer */
.wd.ink, .bubble.read .en.ink, .word.ink, .opt.wordcard .wd { color: #2f2a36; } /* answer cards share one ink so none stands out */
/* phones: two roomy word cards per row */
@media (max-width: 600px) {
  .opt.wordcard, .options.n4 .opt.wordcard { width: 42vw; padding: 8px; }
  .options.n6:has(.wordcard) { grid-template-columns: repeat(2, 42vw); }
}
.opt.right { background: #e9fff6; box-shadow: 0 8px 0 var(--mint), 0 0 0 6px var(--mint); animation: pop .5s ease; }
.opt.wrong { animation: shake .45s ease; filter: grayscale(1); opacity: .6; }
/* after two mistakes the right answer glows softly */
.opt.glow { position: relative; }
.glow::after { content: ""; position: absolute; inset: -8px; border-radius: inherit; pointer-events: none; box-shadow: 0 0 0 6px var(--lemon), 0 0 28px 8px rgba(255,216,77,.8); animation: glowp 1s ease-in-out infinite alternate; }
@keyframes glowp { from { opacity: .35; } to { opacity: 1; } }
.demo-hand { position: absolute; left: 0; top: 0; font-size: 70px; line-height: 1; pointer-events: none; z-index: 31; filter: drop-shadow(0 6px 6px rgba(74,33,96,.3)); will-change: transform; }
.hold-hand { animation: holdHand 1.9s ease forwards; }
@keyframes holdHand { 0% { opacity: 0; translate: 40px 60px; } 20% { opacity: 1; translate: 0 0; scale: 1; } 30%, 80% { opacity: 1; translate: 0 0; scale: .85; } 100% { opacity: 0; translate: 0 0; scale: 1; } }
.opt.fade { opacity: .3; transform: scale(.92); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-12px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-7px); } 80% { transform: translateX(4px); } }

.emo { font-size: 64cqw; line-height: 1; }
.candy { width: 82cqw; height: auto; display: block; }
.cups { display: grid; gap: 1cqw 3cqw; justify-items: center; line-height: 1.05; direction: ltr; }
.cups.c1 { font-size: 58cqw; }
.cups.c2 { grid-template-columns: repeat(2, 1fr); font-size: 38cqw; }
.cups.c3 { grid-template-columns: repeat(3, 1fr); font-size: 23cqw; }
.cups.c4 { grid-template-columns: repeat(2, 1fr); font-size: 30cqw; }
.cups.c5, .cups.c6 { grid-template-columns: repeat(3, 1fr); font-size: 23cqw; }
.cups.c7, .cups.c8 { grid-template-columns: repeat(4, 1fr); font-size: 14cqw; gap: 3cqw 2cqw; }
.cups.c9 { grid-template-columns: repeat(3, 1fr); font-size: 17cqw; gap: 2cqw 4cqw; }
.cups.c10 { grid-template-columns: repeat(5, 1fr); font-size: 11.5cqw; gap: 4cqw 1.5cqw; }
.shape { width: 80cqw; height: auto; display: block; }
.emo.sz-big { font-size: 84cqw; }
.emo.sz-small { font-size: 24cqw; }

/* bubbles game: pictures float up inside soap bubbles */
.bubbles { position: relative; align-self: stretch; overflow: hidden; container-type: size; min-height: 0; border-radius: 30px; }
.bub {
  position: absolute; top: 102%; width: min(23cqw, 32cqh); aspect-ratio: 1; margin-left: calc(min(23cqw, 32cqh) / -2);
  border: 0; border-radius: 50%; padding: 0; box-sizing: border-box; cursor: pointer; font: inherit;
  display: grid; place-items: center; container-type: inline-size;
  background: radial-gradient(circle at 32% 28%, #fff 0 7%, rgba(255,255,255,.5) 8% 18%, rgba(255,255,255,.2) 55%, rgba(255,255,255,.55) 100%);
  box-shadow: inset 0 0 0 4px rgba(255,255,255,.9), inset -8px -10px 18px rgba(142,79,209,.18), 0 8px 18px rgba(74,33,96,.14);
  animation: rise var(--d, 9s) linear var(--dl, 0s) infinite, sway var(--sd, 2.8s) ease-in-out var(--sdl, 0s) infinite alternate;
  transition: scale .3s, opacity .3s;
}
.bub > * { scale: .8; }
@keyframes rise { from { top: 102%; } to { top: -34%; } }
@keyframes sway { from { translate: -10px 0; } to { translate: 10px 0; } }
.bub.popped { animation-play-state: paused; scale: 1.5; opacity: 0; pointer-events: none; }
.bub.nope { opacity: .4; filter: grayscale(.7); pointer-events: none; }

/* feed game: drag the right picture to the friend */
.feed { align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; gap: 2vmin; min-height: 0; }
.pet {
  width: min(32vmin, 290px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; container-type: inline-size;
  background: rgba(255,255,255,.72); box-shadow: inset 0 0 0 6px #fff, 0 10px 30px rgba(74,33,96,.16); transition: transform .2s, box-shadow .2s;
}
.pet span { display: block; font-size: 62cqw; line-height: 1; animation: bob 2.4s ease-in-out infinite; }
.pet.open { transform: scale(1.1); box-shadow: inset 0 0 0 6px var(--mint), 0 0 0 10px rgba(47,191,148,.35); }
.pet.chomp span { animation: chomp .6s ease; }
.pet.no span { animation: shake .45s ease; }
@keyframes chomp { 0%,100% { transform: scale(1); } 30% { transform: scale(1.25,.82); } 60% { transform: scale(.9,1.12); } }
.tray { display: flex; gap: 3vmin; justify-content: center; flex-wrap: wrap; direction: ltr; }
.drag {
  width: min(19vmin, 176px); aspect-ratio: 1; box-sizing: border-box; padding: 12px; border-radius: 30px; position: relative;
  background: var(--card); box-shadow: 0 8px 0 var(--card-edge), 0 14px 28px rgba(142,79,209,.14);
  display: grid; place-items: center; container-type: inline-size; touch-action: none; cursor: grab; transition: transform .3s, opacity .3s;
}
.drag.held { z-index: 5; cursor: grabbing; transition: none; box-shadow: 0 18px 34px rgba(74,33,96,.28); }
.drag.wrong { filter: grayscale(1); opacity: .6; pointer-events: none; }
.drag:focus-visible { outline: 4px solid var(--grape); outline-offset: 4px; }

/* memory game: flip cards to find pairs */
.memory { display: grid; gap: 2.2vmin; justify-content: center; align-content: center; grid-template-columns: repeat(4, min(18vmin, 150px)); direction: ltr; }
.mcard { aspect-ratio: 1; border: 0; padding: 0; background: none; cursor: pointer; position: relative; font: inherit; perspective: 800px; }
.mface {
  position: absolute; inset: 0; border-radius: 24px; display: grid; place-items: center; box-sizing: border-box;
  backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform .45s;
  box-shadow: 0 6px 0 rgba(74,33,96,.15), 0 10px 20px rgba(142,79,209,.14);
}
.mback { background: linear-gradient(135deg, var(--grape), var(--berry)); font-size: min(8vmin, 66px); }
.mfront { background: var(--card); transform: rotateY(180deg); padding: 10px; container-type: inline-size; }
.mcard.up .mback { transform: rotateY(-180deg); }
.mcard.up .mfront { transform: rotateY(0); }
.mcard.match .mfront { box-shadow: 0 6px 0 var(--mint), 0 0 0 5px var(--mint); animation: pop .5s ease; }
.mcard:focus-visible { outline: 4px solid var(--grape); outline-offset: 4px; border-radius: 24px; }
.mfront .wd { font-size: 17cqw; }

/* learn */
.learn-area { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4vmin; min-height: 0; height: 100%; }
.card {
  background: var(--card); border-radius: 40px; padding: 2.6vmin 6vmin 3vmin; box-shadow: 0 8px 0 var(--card-edge), 0 16px 34px rgba(142,79,209,.14);
  display: flex; flex-direction: column; align-items: center; gap: 1.2vmin; max-width: 100%; box-sizing: border-box; cursor: pointer;
}
.card.flip { animation: pop .45s ease; }
.card .pic { width: min(32vmin, 290px); aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; container-type: inline-size; }
.word { direction: ltr; font-size: clamp(42px, 8vmin, 86px); font-weight: 700; color: var(--grape); line-height: 1; }
.word .digit { color: var(--berry); margin-right: .35em; }
.heb { font-size: clamp(20px, 3vmin, 30px); color: var(--ink-soft); }
.learn-nav { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
.dots { display: flex; gap: 8px; }
.dots span { width: 13px; height: 13px; border-radius: 50%; background: #e6d3f5; }
.dots span.on { background: var(--berry); }
.card .pic.veil { border-radius: 30px; background: repeating-linear-gradient(45deg, #f6ecfd 0 18px, #efe0fb 18px 36px); }
.card .pic.veil > * { visibility: hidden; }
.card .heb.veil { visibility: hidden; }
/* Emri's cards: the picture is always in full view (she must see the color while she hears it); a tap makes it
   jump and sparkle and she hears the word again. Counting cards are counted one item per tap. */
.card { position: relative; }
.card .pic.woke { animation: splash .6s ease; }
@keyframes splash { 0% { transform: scale(.8) rotate(-8deg); } 60% { transform: scale(1.14) rotate(4deg); } 100% { transform: scale(1); } }
.cups span.lit { animation: pop .4s ease; filter: drop-shadow(0 0 6px #ffd84d) drop-shadow(0 0 2px #ffb300); }
.tap-hint { position: absolute; top: 34%; left: 4%; font-size: clamp(44px, 7vmin, 70px); line-height: 1; pointer-events: none; animation: tapme 1.1s ease-in-out infinite; filter: drop-shadow(0 4px 4px rgba(74,33,96,.3)); }
@keyframes tapme { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-14px) scale(1.08); } }
/* Next fills up while the word is heard, and only lights up once the card has been woken */
#nextBtn { position: relative; overflow: hidden; isolation: isolate; }
#nextBtn > span { position: relative; z-index: 1; }
#nextBtn.wait { background: #dcc6ef; box-shadow: 0 6px 0 #c3a5df; }
#nextBtn.wait::before { content: ""; position: absolute; inset: 0; z-index: 0; background: var(--berry); transform-origin: right; transform: scaleX(var(--fill, 0)); transition: transform var(--ms, 0ms) linear; }
#nextBtn.ready { animation: pop .5s ease; }
#nextBtn.no { animation: shake .45s ease; }
/* after a mistake Emri sees the word's card again for a moment */
.again-card { cursor: pointer; animation: pop .45s ease; }
.again-card h3 { margin: 0; direction: ltr; font-size: clamp(28px, 5vmin, 48px); color: var(--berry); }
/* skip the cards and go straight to the game (replays, and always for Lavi) */
.btn.play { background: var(--mint); color: #fff; box-shadow: 0 6px 0 #1f8f6e; font-size: clamp(26px, 4.4vmin, 44px); padding: .35em 1.1em; }
.btn.play:active { box-shadow: 0 2px 0 #1f8f6e; }

.pips { display: flex; gap: 7px; direction: ltr; }
.pip { width: clamp(18px, 2.6vmin, 26px); aspect-ratio: 1; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 3px #e6d3f5; }
.pip.now { box-shadow: inset 0 0 0 3px var(--berry); }
.pip.done { background: var(--berry); box-shadow: inset 0 -4px 0 var(--berry-d); }
/* review rounds (weak words, bonus repeats) get a lemon pip */
.pip.extra { box-shadow: inset 0 0 0 3px var(--lemon); }
.pip.extra.now { box-shadow: inset 0 0 0 3px var(--lemon), 0 0 0 3px var(--berry); }
.pip.extra.done { background: var(--lemon); box-shadow: inset 0 -4px 0 #e0a800; }
.wpet { display: inline-block; }
.wpet.cheer { animation: hop .75s ease; }

/* ---------- Stickers ---------- */
.stk {
  font: inherit; color: inherit; border: 0; padding: 6%; box-sizing: border-box; cursor: pointer;
  background: var(--card); border-radius: 22px; box-shadow: 0 5px 0 var(--card-edge), 0 8px 16px rgba(142,79,209,.12);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2cqw; container-type: inline-size; min-width: 0;
}
.stk .spic { width: 100%; aspect-ratio: 1; display: grid; place-items: center; container-type: inline-size; }
.stk .slbl { display: block; width: 100%; text-align: center; min-height: 1.1em; line-height: 1.1; }
.stk.miss { background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 3px rgba(255,255,255,.8); cursor: default; }
.stk.miss .spic { filter: brightness(0) opacity(.15); }
.stk.bounce { animation: hop .6s ease; }
.stk:focus-visible, .book-tab:focus-visible, .chest:focus-visible { outline: 4px solid var(--grape); outline-offset: 4px; }
/* a new sticker flips in with a glow */
.stk-row { display: flex; gap: 3vmin; justify-content: center; }
.stk.new { width: clamp(96px, 17vmin, 150px); position: relative; opacity: 0; animation: stkIn .8s ease forwards; animation-delay: var(--dl, 1.1s); cursor: pointer; }
.stk.new::after { content: ""; position: absolute; inset: -6px; border-radius: inherit; pointer-events: none; box-shadow: 0 0 0 5px var(--lemon), 0 0 30px 10px rgba(255,216,77,.75); animation: glowp 1s ease-in-out infinite alternate; }
@keyframes stkIn { 0% { opacity: 0; transform: perspective(600px) rotateY(180deg) scale(.3); } 60% { opacity: 1; transform: perspective(600px) rotateY(-12deg) scale(1.12); } 100% { opacity: 1; transform: none; } }
.bookbtn { font-size: clamp(30px, 4.6vmin, 44px); width: clamp(60px, 9vmin, 84px); }
.days { white-space: nowrap; direction: ltr; }
.win-card.has-stk .princess { height: min(18vh, 150px); }

/* sticker book: a page per world */
.book-tabs { display: flex; gap: 2vmin; justify-content: center; flex-wrap: wrap; }
.book-tab {
  font: inherit; border: 0; cursor: pointer; border-radius: 26px; padding: .25em .5em; line-height: 1.1;
  font-size: clamp(30px, 5.4vmin, 52px); box-shadow: 0 5px 0 rgba(74,33,96,.14); opacity: .6; transition: transform .15s, opacity .15s;
  display: flex; flex-direction: column; align-items: center; color: var(--ink);
}
.book-tab small { font-size: clamp(13px, 1.8vmin, 17px); font-weight: 600; direction: ltr; font-variant-numeric: tabular-nums; }
.book-tab.on { opacity: 1; transform: scale(1.12); box-shadow: 0 5px 0 rgba(74,33,96,.2), 0 0 0 4px #fff; }
.book-grid {
  flex: 1; min-height: 0; overflow-y: auto; display: grid; gap: 1.6vmin; direction: ltr; padding: 6px 4px 10px;
  grid-template-columns: repeat(8, minmax(0, min(14.5vmin, 130px))); justify-content: center; align-content: center;
}
.book-grid.reads { grid-template-columns: repeat(8, minmax(0, min(12.2vmin, 118px))); }
@media (orientation: portrait) {
  .book-grid { grid-template-columns: repeat(5, minmax(0, min(17vw, 140px))); }
  .book-grid.reads { grid-template-columns: repeat(5, minmax(0, min(14vw, 120px))); }
}
#bookCount { direction: ltr; }

/* daily treasure chest */
.chest-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2vmin; }
.chest { border: 0; background: none; padding: 0; cursor: pointer; width: min(46vmin, 380px); animation: chestBob 1.4s ease-in-out infinite; transform-origin: center bottom; }
.chest svg { width: 100%; height: auto; display: block; overflow: visible; }
.chest .lid { transform-box: view-box; transform-origin: 30px 92px; transition: transform .5s cubic-bezier(.3,1.6,.5,1); }
.chest.shake { animation: chestShake .45s ease; }
.chest.shake2 { animation: chestShake .6s ease 2; }
.chest.open { animation: none; cursor: default; }
.chest.open .lid { transform: rotate(-28deg) translateY(-14px); }
.chest .shine { opacity: 0; transition: opacity .4s; }
.chest.open .shine { opacity: 1; }
.chest-x { position: absolute; top: -8px; right: -8px; }
.stk.chest-stk { position: absolute; z-index: 2; top: -6%; left: 50%; margin-left: calc(clamp(96px, 17vmin, 150px) / -2); }
@keyframes chestBob { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-16px) scale(1.03,.98); } }
@keyframes chestShake { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-8deg) scale(1.05); } 45% { transform: rotate(7deg) scale(1.05); } 70% { transform: rotate(-4deg); } }

@media (orientation: portrait) {

  .memory.m12 { grid-template-columns: repeat(3, min(20vmin, 150px)); }
}

@media (max-width: 600px) and (orientation: portrait) { .memory.m12 { grid-template-columns: repeat(3, 26vw); } }

/* ---------- Overlay + effects ---------- */
#overlay { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(74,33,96,.38); padding: 16px; }
.win-card { background: var(--card); border-radius: 40px; padding: 4vmin 6vmin; text-align: center; max-width: min(600px, 100%); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 1.6vmin; animation: pop .5s ease; box-shadow: 0 10px 0 var(--card-edge); }
.win-card h3 { margin: 0; direction: ltr; font-size: clamp(34px, 6.4vmin, 64px); color: var(--grape); line-height: 1.05; text-wrap: balance; }

.stars { display: flex; gap: 2vmin; }
.stars svg { width: clamp(52px, 10vmin, 96px); height: auto; opacity: 0; animation: starIn .55s ease forwards; }

@keyframes starIn { 0% { opacity: 0; transform: scale(.2) rotate(-40deg); } 70% { opacity: 1; transform: scale(1.2) rotate(8deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
.win-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

#fx { position: absolute; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.conf { position: absolute; top: -40px; width: 14px; height: 22px; border-radius: 7px; animation: fall var(--d) linear forwards; }
@keyframes fall { to { transform: translate(var(--x), 112vh) rotate(var(--r)); } }
.spark { position: absolute; font-size: 30px; line-height: 1; margin: -15px 0 0 -15px; animation: burst .9s ease-out forwards; }
@keyframes burst { 0% { transform: translate(0,0) scale(.4); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; } }
.balloon { position: absolute; bottom: -90px; font-size: 64px; line-height: 1; animation: floatUp var(--d) ease-in forwards; }
@keyframes floatUp { to { transform: translate(var(--x), -125vh) rotate(var(--r)); } }
.win-card.spin .princess { animation: twirl 1s ease .3s; }

    if (!W) { goWorlds(); return; }
    const th = THEMES[W.id];
    // On a narrow phone the 1000-wide map is drawn tiny: grow the nodes (k) and drop the labels.
    const fit = Math.min((innerWidth - 32) / 1000, (innerHeight - 110) / 720), k = Math.max(1, Math.min(1.7, .6 / fit));
    const grow = (x, y) => k > 1 ? `transform="translate(${x} ${y}) scale(${k.toFixed(2)}) translate(${-x} ${-y})"` : '';
    $('#mapTitle').innerHTML = `${W.he} · <span class="en">${W.name}</span>`;

    });
    const [cx, cy] = POS[cur.idx];
    s += `<g ${grow(cx, cy)}>${playerDrawing()('', `x="${cx - 128}" y="${cy - 150}" width="100" height="150"`)}
      <text class="pointer" x="${cx}" y="${cy - 100}" text-anchor="middle" font-size="44" aria-hidden="true">👇</text></g>`;
    const world = $('#world');

    world.innerHTML = s;
    const replay = (el, cls) => { el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); };
    world.querySelectorAll('.node').forEach(n => {

    area.className = 'bubbles';
    area.innerHTML = items.map((w, k) => {
      const d = 8 + Math.random() * 3, phase = (k * 0.618 + Math.random() * 0.12) % 1;
      return `<button class="bub" type="button" data-k="${k}" aria-label="${w.he}" style="left:${(k + .5) * 100 / n}%;--d:${d.toFixed(2)}s;--sd:${(2.4 + k * .3).toFixed(1)}s;--dl:${(-phase * d).toFixed(2)}s;--sdl:${(-k * .7).toFixed(1)}s">${picHTML(w)}</button>`;
    }).join('');
    G.rightEl = area.querySelector(`[data-k="${items.indexOf(t)}"]`);
    area.querySelectorAll('.bub').forEach(b => b.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (G.locked) return;
      const w = items[+b.dataset.k];
      if (w === t) { sfx.pop(); b.classList.add('popped'); gotIt(b, t); }
      else { b.classList.add('nope'); missed(w, t); }
    }));
  }

  function roundFeed(t) {
    const opts = shuffle([t, ...others(t, G.nOpt - 1)]);
    area.className = 'feed';
    area.innerHTML = `<div class="pet"><span>${W.pet}</span></div>
      <div class="tray">${opts.map((w, k) => `<div class="drag" data-k="${k}" role="button" tabindex="0" aria-label="${w.he}">${picHTML(w)}</div>`).join('')}</div>`;
    const pet = area.querySelector('.pet');
    G.rightEl = area.querySelector(`[data-k="${opts.indexOf(t)}"]`);
    const near =(x, y) => { const r = pet.getBoundingClientRect(), m = 36; return x > r.left - m && x < r.right + m && y > r.top - m && y < r.bottom + m; };
    const drop = (el, w) => {
      if (w === t) {
        G.locked = true;
        const a = el.getBoundingClientRect(), b = pet.getBoundingClientRect(), [dx, dy] = el._d || [0, 0];
        el.style.transform = `translate(${dx + b.left + b.width / 2 - a.left - a.width / 2}px, ${dy + b.top + b.height / 2 - a.top - a.height / 2}px) scale(.15)`;
        el.style.opacity = '0';
        pet.classList.add('chomp'); sfx.yum();
        gotIt(pet, t, 'Yum!');
      } else {
        el.style.transform = ''; el.classList.add('wrong');
        pet.classList.add('no'); setTimeout(() => pet.classList.remove('no'), 600);
        missed(w, t);
      }
    };
    area.querySelectorAll('.drag').forEach(el => {
      const w = opts[+el.dataset.k];
      let sx = 0, sy = 0, moved = false, id = null;
      el.addEventListener('pointerdown', e => {
        if (G.locked || id !== null) return;
        id = e.pointerId;
        try { el.setPointerCapture(id); } catch (err) {}
        sx = e.clientX; sy = e.clientY; moved = false; el._d = [0, 0];
        el.classList.add('held');
      });
      el.addEventListener('pointermove', e => {
        if (e.pointerId !== id) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if (Math.abs(dx) + Math.abs(dy) > 10) moved = true;
        el._d = [dx, dy];
        el.style.transform = `translate(${dx}px, ${dy}px) scale(1.08)`;
        pet.classList.toggle('open', moved && near(e.clientX, e.clientY));
      });
      const up = e => {
        if (e.pointerId !== id) return;
        id = null; el.classList.remove('held'); pet.classList.remove('open');
        if (!moved) { el.style.transform = ''; if (!reads()) say(w.en); return; } // a tap names the picture (not for Lavi: he must read)
        if (e.type === 'pointerup' && near(e.clientX, e.clientY)) drop(el, w); else el.style.transform = '';
      };
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
      el.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !G.locked) { e.preventDefault(); el._d = [0, 0]; drop(el, w); } });
    });
  }

  function startMemory() {
    // Emri matches two same pictures; Lavi matches a picture with its written word.
    const words = shuffle(L.words).slice(0, 6), read = reads();
    const cards = shuffle([...words.map(w => [w, 0]), ...words.map(w => [w, read ? 1 : 0])]);
    Object.assign(G, { pairs: words.length, found: 0, open: [], last: null });
    $('#promptText').hidden = false; $('#promptPic').hidden = true;
    $('#promptText').closest('.bubble').classList.remove('read');
    $('#promptText').textContent = 'Match!';
    $('#hint').textContent = hintFor('memory');
    $('#pips').innerHTML = words.map(() => '<span class="pip"></span>').join('');
    area.className = `memory m${cards.length}`;
    area.innerHTML = cards.map(([w, isWord], k) => `<button class="mcard" type="button" data-k="${k}" aria-label="קלף ${k + 1}">
      <span class="mface mback">${W.icon}</span><span class="mface mfront">${isWord ? wordHTML(w, 14) : picHTML(w)}</span></button>`).join('');
    fitWords(area);
    area.querySelectorAll('.mcard').forEach(b => b.addEventListener('click', () => flipCard(b, cards[+b.dataset.k][0])));
    if (!read && !demoSeen.has('memory')) { demoSeen.add('memory'); later(() => demo('memory'), 1200); }
  }
  function flipCard(b, w) {
    if (G.locked || b.classList.contains('up')) return;
    b.classList.add('up'); sfx.flip();
    G.last = w;
    // Lavi hears the word only once he has matched it, so he still has to read.
    if (!reads()) { say(w.en); $('#promptText').textContent = w.en; }
    G.open.push([b, w]);
    if (G.open.length < 2) return;
    const [[b1, w1], [b2, w2]] = G.open;
    G.open = [];
    if (w1 === w2) {
      G.found++;
      // A match can be luck, so it only marks the word as met (box 0 -> 1); mismatches never count against words.
      const r = progress.words[wid(w1)];
      if (!r || !r.box) markWord(w1, true); else r.seen++;
      save();
      b1.classList.add('match'); b2.classList.add('match');
      if (reads()) { say(w1.en); $('#promptText').textContent = w1.en; }
      $('#pips').querySelectorAll('.pip').forEach((p, k) => p.classList.toggle('done', k < G.found));
      later(() => { sfx.good(); burst(b2); mood('happy'); say(cheer(), true); }, 350);
      if (G.found === G.pairs) {
        G.locked = true;
        const stars = G.mistakes <= G.pairs + 2 ? 3 : G.mistakes <= G.pairs * 2 + 4 ? 2 : 1;
        later(() => (G.review && G.review.length ? startReview(stars) : finish(stars)), 2100);
      }
    } else {
      G.mistakes++; G.locked = true;
      later(() => { b1.classList.remove('up'); b2.classList.remove('up'); G.locked = false; }, 1300);
    }
  }

  // After a memory board, the due words come as quick picture rounds; the board's stars are kept.
  function startReview(stars) {
    Object.assign(G, { type: 'quiz', memStars: stars, targets: G.review, tags: G.review.map(() => 'weak'), i: 0, mistakes: 0, nOpt: reads() ? 4 : 3 });
    renderRound();
  }

  // ---------- Finish ----------
  function finish(stars) {
    progress.stars[L.id] = Math.max(progress.stars[L.id] || 0, stars);
    // A new sticker from this level's words (a palace gives one from its world); 3 stars give a second one.
    const pool = L.words || worldWords(L.W), got = [];
    for (let k = 0; k < (stars === 3 ? 2 : 1); k++) { const w = awardSticker(pool); if (w) got.push(w); }
    save();
    const final = L.kind === 'mix';
    const next = L.W.levels[L.idx + 1];
    let starsSvg = '';
    for (let k = 0; k < 3; k++) starsSvg += `<svg viewBox="0 0 60 60"><path d="${starPath(30, 31, 28)}" fill="${k < stars ? '#ffd23f' : '#efe4f7'}" stroke="${k < stars ? '#e0a800' : '#e0cff0'}" stroke-width="3" stroke-linejoin="round"/></svg>`;
    const ov = $('#overlay');
    const crown = P.g === 'f' ? L.W.queen : L.W.king;
    // A little variety: one of three cheers, each with its own celebration.
    const v = Math.floor(Math.random() * 3);
    ov.innerHTML = `<div class="win-card ${v === 2 ? 'spin' : ''} ${got.length ? 'has-stk' : ''}">
      ${playerDrawing()('happy')}
      <h3>${final ? crown[0] : ['You did it!', 'Amazing!', 'Hooray!'][v]}</h3>
      <p>${final ? crown[1] : `כל הכבוד, ${P.he}!`}</p>
      <div class="stars">${starsSvg}</div>
      ${got.length ? `<div class="stk-row">${got.map((w, k) => stickerHTML(w, 'new', `data-id="${wid(w)}" style="--dl:${1.2 + k * .5}s"`)).join('')}</div>` : ''}
      <div class="win-actions">
        <button class="btn" type="button" id="againBtn">↻ שוב</button>
        ${next ? '<button class="btn primary" type="button" id="nextLvBtn">לשלב הבא ◀</button>' : '<button class="btn primary" type="button" id="mapBtn">למפה</button>'}
      </div></div>`;
    overlay(true);
    sfx.win();
    if (final || v === 0) confetti(final ? 120 : 60); else if (v === 1) balloons(14); else { confetti(30); starShower(); }
    say(final ? `${P.g === 'f' ? 'Queen' : 'King'} ${P.name}!` : `Great job, ${P.name}!`);
    if (got.length) {
      wireStickers(ov);
      const card = ov.querySelector('.win-card');
      got.forEach((w, k) => setTimeout(() => { if (card.isConnected && !ov.hidden) { sfx.tada(); say(w.en, true); } }, 1300 + k * 500));
    }
    $('#againBtn').addEventListener('click', () => { sfx.tap(); overlay(false); startLevel(L); });
    const nb = $('#nextLvBtn'); if (nb) nb.addEventListener('click', () => { sfx.tap(); startLevel(next); });
    const mb = $('#mapBtn'); if (mb) mb.addEventListener('click', () => { sfx.tap(); goMap(); });
  }

  // ---------- Effects ----------
  const CANDY = ['#ff4f9a', '#ffd84d', '#5fd3b5', '#9b59d9', '#5ec8e8', '#ffb347', '#ff8fc7'];
  function confetti(n) {
    const fx = $('#fx');
    for (let i = 0; i < n; i++) {
      const c = document.createElement('span');
      c.className = 'conf';
      c.style.left = Math.random() * 100 + '%';
      c.style.background = CANDY[i % CANDY.length];
      if (i % 3 === 0) { c.style.width = c.style.height = '16px'; c.style.borderRadius = '50%'; }
      c.style.setProperty('--d', (2.2 + Math.random() * 1.8) + 's');
      c.style.setProperty('--x', (Math.random() * 160 - 80) + 'px');
      c.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg');
      c.style.animationDelay = Math.random() * .6 + 's';
      fx.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }
  function balloons(n) {
    const fx = $('#fx');
    for (let i = 0; i < n; i++) {
      const b = document.createElement('span');
      b.className = 'balloon';
      b.textContent = i % 4 === 3 ? '⭐' : '🎈';
      b.style.left = (4 + Math.random() * 88) + '%';
      b.style.setProperty('--d', (3 + Math.random() * 1.6) + 's');
      b.style.setProperty('--x', (Math.random() * 120 - 60) + 'px');
      b.style.setProperty('--r', (Math.random() * 40 - 20) + 'deg');
      b.style.animationDelay = Math.random() * .8 + 's';
      fx.appendChild(b);
      setTimeout(() => b.remove(), 6000);
    }
  }
  // Star bursts popping around the win card.
  function starShower() {
    const card = $('.win-card');
    [0, 350, 700, 1050].forEach(ms => setTimeout(() => {
      if (!card.isConnected) return;
      const r = card.getBoundingClientRect(), spot = document.createElement('div');
      spot.style.cssText = `position:fixed;left:${r.left + Math.random() * r.width}px;top:${r.top + Math.random() * r.height * .6}px;width:1px;height:1px`;
      document.body.appendChild(spot); burst(spot); spot.remove();
    }, ms));
  }
  function burst(el) {
    const r = el.getBoundingClientRect(), fx = $('#fx'), box = fx.getBoundingClientRect();
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      s.textContent = i % 2 ? '★' : '✦';
      s.style.color = CANDY[i % CANDY.length];
      s.style.left = (r.left - box.left + r.width / 2) + 'px';
      s.style.top = (r.top - box.top + r.height / 2) + 'px';
      const a = i / 12 * Math.PI * 2, d = 90 + Math.random() * 60;
      s.style.setProperty('--dx', Math.cos(a) * d + 'px');
      s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      fx.appendChild(s);
      setTimeout(() => s.remove(), 1000);
    }
  }
})();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
